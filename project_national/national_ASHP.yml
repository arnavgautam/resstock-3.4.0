schema_version: '0.4'
os_version: 3.9.0
os_sha: c77fbb9569
buildstock_directory: ../ # Relative to this file or absolute
project_directory: project_national # Relative to buildstock_directory
output_directory: national_ASHP
weather_files_url: https://data.nrel.gov/system/files/156/Buildstock_TMY3_FIPS-1678817889.zip
# weather_files_path: c:/OpenStudio/BuildStock_TMY3_FIPS.zip

sampler:
  type: precomputed
  # type: residential_quota
  # args:
  #   n_datapoints: 8000

workflow_generator:
  type: residential_hpxml
  version: 2024.07.20
  args:
    build_existing_model:
      simulation_control_timestep: 60
      simulation_control_run_period_begin_month: 1
      simulation_control_run_period_begin_day_of_month: 1
      simulation_control_run_period_end_month: 12
      simulation_control_run_period_end_day_of_month: 31
      simulation_control_run_period_calendar_year: 2022

    emissions:
      - scenario_name: LRMER_MidCase_15
        type: CO2e
        elec_folder: data/emissions/cambium/2022/LRMER_MidCase_15

    utility_bills:
      - scenario_name: Bills

    simulation_output_report:
      timeseries_frequency: hourly
      include_timeseries_total_consumptions: true
      include_timeseries_fuel_consumptions: true
      include_timeseries_end_use_consumptions: true
      include_timeseries_emissions: true
      include_timeseries_emission_fuels: true
      include_timeseries_emission_end_uses: true
      include_timeseries_hot_water_uses: true
      include_timeseries_total_loads: true
      include_timeseries_component_loads: true
      include_timeseries_unmet_hours: true
      include_timeseries_zone_temperatures: true
      include_timeseries_airflows: true
      include_timeseries_weather: true
      include_timeseries_resilience: true

    reporting_measures:
      - measure_dir_name: QOIReport
      - measure_dir_name: ServerDirectoryCleanup
        arguments:
          retain_in_osm: true
          retain_eplusout_audit: true
          retain_eplusout_bnd: true
          retain_eplusout_eio: true
          retain_eplusout_end: true
          retain_eplusout_err: true
          retain_eplusout_eso: true
          retain_eplusout_mtd: true
          retain_eplusout_rdd: true
          retain_eplusout_mdd: true
          retain_eplustbl_htm: true

    server_directory_cleanup:
      retain_schedules_csv: false

baseline:
  n_buildings_represented: 139647020 # American Community Survey 2021 5-year, B25001, does not include territories ( 138765649 without AK and HI )

upgrades:
  - upgrade_name: ASHP_auto_sizing
    package_apply_logic:
      - HVAC Has Ducts|Yes
    options:
      - &hvac_heating_efficiency_ashp_seer_14pt12_8pt34_hspf
        option: HVAC Heating Efficiency|ASHP, SEER 14.12, 8.34 HSPF, AUTOSIZED, Removing Lockout
        costs:
          - value: 50.0
            multiplier: Size, Heating System Primary (kBtu/h)
        lifetime: 30
      - &hvac_cooling_efficiency_ducted_heat_pump
        option: HVAC Cooling Efficiency|Ducted Heat Pump
      - &heat_pump_backup_not_existing_system
        option: Heat Pump Backup|Not Existing System